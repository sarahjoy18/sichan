  .panel {
    position:absolute; top:16px; right:16px; width:320px; max-width:calc(100% - 32px);

    background:#2b2f36; color:#fff; border-radius:14px; overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.35); z-index:1000;
    display:none; flex-direction:column;

  .panel.open { display:flex; }

  /* Numbered map markers */
  .leaflet-div-icon.numbered-marker { background:transparent; border:none; }
  .numbered-marker .pin {
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:0.72rem; border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.45);
  }
  .stop-tooltip {
    background:#2b2f36; color:#fff; border:none; border-radius:6px; padding:4px 9px;

  }
  .stop-tooltip::before { border-top-color:#2b2f36; }

  .transit-tooltip.leaflet-tooltip {
    display:flex; align-items:center; gap:6px; background:#fff; border:1px solid rgba(0,0,0,0.1);

  .transit-tooltip .ti-label { font-size:0.78rem; font-weight:700; color:#2b2f36; line-height:1; }

    position:absolute; top:6px; left:50%; transform:translateX(-50%);

<script>
function categoryLabel(types) {
  const skip = new Set(["point_of_interest","establishment","political","sublocality","sublocality_level_1","sublocality_level_2"]);
  const t = (types || []).find(x => !skip.has(x));
  if (!t) return "Place";
  return t.split("_").map(w => w[0].toUpperCase()+w.slice(1)).join(" ");
}
function categoryIcon(types) {
  const map = {
    train_station:"🚉", transit_station:"🚉", international_airport:"✈️", airport:"✈️",
    tourist_attraction:"📍", historical_landmark:"🏯", historical_place:"🏯", castle:"🏯",
    garden:"🌳", park:"🌳", market:"🛍️", museum:"🏛️", buddhist_temple:"⛩️",
    shinto_shrine:"⛩️", place_of_worship:"⛩️", observation_deck:"🚡", scenic_spot:"🍁",
    hiking_area:"🥾"
  };
  for (const t of (types||[])) if (map[t]) return map[t];
  return "📍";
}
function starString(rating) {
  if (!rating) return "";
  const full = Math.round(rating);
  return "★".repeat(full) + "☆".repeat(5-full);
}
function mapsUrl(placeId) {
  return placeId ? `https://www.google.com/maps/place/?q=place_id:${placeId}` : "#";
}
function transportInfo(note) {
  if (!note) return null;
  const n = note.toUpperCase();
  if (n.includes('SHINKANSEN')) return { icon: '🚄', label: 'Shinkansen' };
  if (n.includes('ROPEWAY')) return { icon: '🚡', label: 'Ropeway' };
  if (n.includes('TRAIN')) return { icon: '🚆', label: 'Train' };
  if (n.includes('SUBWAY')) return { icon: '🚇', label: 'Subway' };
  if (n.includes('BUS')) return { icon: '🚌', label: 'Bus' };
  if (n.includes('WALK')) return { icon: '🚶', label: 'Walk' };
  return null;
}
function segmentInfo(fromStop, toStop) {
  return transportInfo(toStop.note) || transportInfo(fromStop.note) || { icon: '🚶', label: 'Walk' };
}
function routeUrl(stops) {
  const coords = stops.map(s => `${s.lat},${s.lng}`);
  const origin = coords[0], destination = coords[coords.length-1];
  const waypoints = coords.slice(1,-1).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=transit`;
  if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
  return url;
}

// Flatten all stops across all days into one continuous list for cross-day pagination
const flatStops = [];
days.forEach(day => day.stops.forEach((s, i) => flatStops.push({ day, stop: s, idxInDay: i })));

// Group stops that share (near-)identical coordinates so we can fan overlapping markers apart visually
function coordKey(s) { return s.lat.toFixed(5) + ',' + s.lng.toFixed(5); }
const coordGroups = {};
flatStops.forEach((f, flatIdx) => {
  const k = coordKey(f.stop);
  (coordGroups[k] = coordGroups[k] || []).push(flatIdx);
});
function markerLatLng(stop, flatIdx) {
  const group = coordGroups[coordKey(stop)];
  if (group.length <= 1) return [stop.lat, stop.lng];
  const pos = group.indexOf(flatIdx);
  const angle = (2 * Math.PI * pos) / group.length;
  const offsetDeg = 0.0009; // small ring radius, ~100m
  const latOff = offsetDeg * Math.sin(angle);
  const lngOff = (offsetDeg * Math.cos(angle)) / Math.cos(stop.lat * Math.PI / 180);
  return [stop.lat + latOff, stop.lng + lngOff];
}

const map = L.map('map').setView([36.0, 137.0], 8);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri — Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), TomTom'
}).addTo(map);

const dayLayers = {};
const allBounds = [];

days.forEach(day => {
  const layerGroup = L.layerGroup();
  const latlngs = day.stops.map(s => [s.lat, s.lng]);
  for (let i = 0; i < latlngs.length - 1; i++) {
    const a = day.stops[i], b = day.stops[i + 1];
    // visible dashed line (decorative only)
    L.polyline([latlngs[i], latlngs[i + 1]], {
      color: day.color, weight: 3, opacity: 0.8, dashArray: '6,6', interactive: false
    }).addTo(layerGroup);
    // wider invisible line on top, purely to make hovering easy
    const hitLine = L.polyline([latlngs[i], latlngs[i + 1]], {
      color: day.color, weight: 16, opacity: 0
    }).addTo(layerGroup);

    const info = segmentInfo(a, b);
    hitLine.bindTooltip(
      `<span class="ti-icon">${info.icon}</span><span class="ti-label">${info.label}</span>`,
      { sticky: true, direction: 'top', offset: [0, -10], className: 'transit-tooltip' }
    );
  }

  day.stops.forEach((s, i) => {
    const flatIdx = flatStops.findIndex(f => f.day.n === day.n && f.idxInDay === i);
    const icon = L.divIcon({
      className: 'numbered-marker',
      html: `<div class="pin" style="background:${day.color}">${i+1}</div>`,
      iconSize: [26, 26],
      iconAnchor: [13, 13],
      popupAnchor: [0, -13],
    });
    const marker = L.marker(markerLatLng(s, flatIdx), { icon }).addTo(layerGroup);
    marker.bindTooltip(s.name, { direction: 'top', offset: [0, -14], className: 'stop-tooltip' });
    marker.on('click', () => openDetailCard(flatIdx));
    allBounds.push([s.lat, s.lng]);
  });
  dayLayers[day.n] = layerGroup;
});

function showOnly(dayNum) {
  Object.values(dayLayers).forEach(l => map.removeLayer(l));
  closeDetail();
  if (dayNum === 'all') {
    Object.values(dayLayers).forEach(l => l.addTo(map));
    map.fitBounds(allBounds, { padding: [30,30] });
    closeList();
  } else {
    dayLayers[dayNum].addTo(map);
    const day = days.find(d => d.n === dayNum);
    map.fitBounds(day.stops.map(s => [s.lat, s.lng]), { padding: [50,50] });
    openListPanel(dayNum);
  }
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(dayNum === 'all' ? 'allBtn' : 'day-' + dayNum).classList.add('active');
}

// ---- List panel (per day sequence) ----
const listPanel = document.getElementById('listPanel');
function openListPanel(dayNum, highlightFlatIdx) {
  const day = days.find(d => d.n === dayNum);
  document.getElementById('panelDayTag').textContent = 'Day ' + day.n;
  document.getElementById('panelTitle').textContent = day.title;
  document.getElementById('panelSummary').textContent = day.summary;
  document.getElementById('openRouteBtn').onclick = () => window.open(routeUrl(day.stops), '_blank');

  const listEl = document.getElementById('stopList');
  listEl.innerHTML = '';
  day.stops.forEach((s, i) => {
    const flatIdx = flatStops.findIndex(f => f.day.n === day.n && f.idxInDay === i);
    const row = document.createElement('div');
    row.className = 'stopRow';
    row.id = 'listrow-' + flatIdx;
    if (flatIdx === highlightFlatIdx) row.classList.add('active');
    row.onclick = () => openDetailCard(flatIdx);
    const ratingHtml = s.rating
      ? `<span class="stars">${starString(s.rating)}</span> ${s.rating.toFixed(1)} (${s.count.toLocaleString()}) · ${categoryLabel(s.types)}`
      : categoryLabel(s.types);
    row.innerHTML = `
      <div class="stopThumb" style="background:${day.color}">${categoryIcon(s.types)}</div>
      <div class="stopInfo">
        <div class="stopName">${i+1}. ${s.name}</div>
        <div class="stopMeta">${ratingHtml}</div>
        <div class="stopNote">${s.note}</div>
      </div>`;
    listEl.appendChild(row);
  });
  listPanel.classList.add('open');
  if (highlightFlatIdx !== undefined) {
    const activeRow = document.getElementById('listrow-' + highlightFlatIdx);
    if (activeRow) activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
function closeList() { listPanel.classList.remove('open'); }
document.getElementById('panelClose').onclick = closeList;
document.getElementById('panelCollapseBtn').onclick = () => {
  listPanel.classList.toggle('collapsed');
  document.getElementById('panelCollapseBtn').textContent = listPanel.classList.contains('collapsed') ? '▸' : '▾';
};

// ---- Detail card (single stop, continuous pagination across all days) ----
const detailCard = document.getElementById('detailCard');
let currentFlatIdx = 0;

function openDetailCard(flatIdx) {
  currentFlatIdx = flatIdx;
  renderDetail();
  detailCard.classList.add('open');
  const { day, stop } = flatStops[flatIdx];
  if (listPanel.classList.contains('open')) openListPanel(day.n, flatIdx);
  map.panTo([stop.lat, stop.lng]);
}
function closeDetail() { detailCard.classList.remove('open'); }
function renderDetail() {
  const { day, stop } = flatStops[currentFlatIdx];
  document.getElementById('cardDayTag').textContent = 'Day ' + day.n;
  document.getElementById('cardBanner').style.background = `linear-gradient(135deg, ${day.color}, #1c1f24)`;
  document.getElementById('cardIcon').textContent = categoryIcon(stop.types);
  document.getElementById('cardName').textContent = stop.name;
  document.getElementById('cardCategory').textContent = categoryLabel(stop.types);
  if (stop.rating) {
    document.querySelector('#cardMeta .stars').textContent = starString(stop.rating);
    document.getElementById('cardRatingText').textContent = `${stop.rating.toFixed(1)} (${stop.count.toLocaleString()})`;
  } else {
    document.querySelector('#cardMeta .stars').textContent = '';
    document.getElementById('cardRatingText').textContent = 'No rating';
  }
  document.getElementById('cardNotes').textContent = stop.note;
  const phoneRow = document.getElementById('cardPhoneRow');
  if (stop.phone) {
    phoneRow.style.display = 'flex';
    phoneRow.href = 'tel:' + stop.phone.replace(/[^+\d]/g,'');
    document.getElementById('cardPhone').textContent = stop.phone;
  } else {
    phoneRow.style.display = 'none';
  }
  document.getElementById('cardMapsRow').href = mapsUrl(stop.place_id);

  document.getElementById('cardCounter').innerHTML =
    `${currentFlatIdx+1} of ${flatStops.length}<span id="cardCounterDay">Day ${day.n} — ${day.title}</span>`;
  document.getElementById('prevBtn').disabled = currentFlatIdx === 0;
  document.getElementById('nextBtn').disabled = currentFlatIdx === flatStops.length - 1;
}
function stepDetail(delta) {
  const newIdx = currentFlatIdx + delta;
  if (newIdx < 0 || newIdx >= flatStops.length) return;
  const prevDay = flatStops[currentFlatIdx].day.n;
  currentFlatIdx = newIdx;
  const newDay = flatStops[currentFlatIdx].day.n;
  if (newDay !== prevDay) {
    // crossed into a new day: switch the map view and highlight the right day button
    Object.values(dayLayers).forEach(l => map.removeLayer(l));
    dayLayers[newDay].addTo(map);
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('day-' + newDay).classList.add('active');
  }
  renderDetail();
  if (listPanel.classList.contains('open')) openListPanel(newDay, currentFlatIdx);
  const { stop } = flatStops[currentFlatIdx];
  map.panTo([stop.lat, stop.lng]);
}
document.getElementById('prevBtn').onclick = () => stepDetail(-1);
document.getElementById('nextBtn').onclick = () => stepDetail(1);
document.getElementById('cardCloseBtn').onclick = closeDetail;
document.getElementById('cardBackBtn').onclick = () => {
  closeDetail();
  openListPanel(flatStops[currentFlatIdx].day.n);
};

// ---- Draggable panels ----
function makeDraggable(panel, handle) {
  let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
  handle.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return; // let buttons work normally
    e.stopPropagation();
    const wrapEl = document.getElementById('mapWrapper');
    const panelRect = panel.getBoundingClientRect();
    const wrapRect = wrapEl.getBoundingClientRect();
    origLeft = panelRect.left - wrapRect.left;
    origTop = panelRect.top - wrapRect.top;
    panel.style.left = origLeft + 'px';
    panel.style.top = origTop + 'px';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    startX = e.clientX; startY = e.clientY;
    dragging = true;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.stopPropagation();
    const wrapEl = document.getElementById('mapWrapper');
    const wrapRect = wrapEl.getBoundingClientRect();
    let newLeft = origLeft + (e.clientX - startX);
    let newTop = origTop + (e.clientY - startY);
    newLeft = Math.max(-panel.offsetWidth + 60, Math.min(newLeft, wrapRect.width - 60));
    newTop = Math.max(0, Math.min(newTop, wrapRect.height - 40));
    panel.style.left = newLeft + 'px';
    panel.style.top = newTop + 'px';
  });
  function endDrag(e) { dragging = false; try { handle.releasePointerCapture(e.pointerId); } catch(err){} }
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);
}
makeDraggable(listPanel, document.getElementById('panelHeader'));
makeDraggable(detailCard, document.getElementById('cardBanner'));
L.DomEvent.disableClickPropagation(listPanel);
L.DomEvent.disableScrollPropagation(listPanel);
L.DomEvent.disableClickPropagation(detailCard);
L.DomEvent.disableScrollPropagation(detailCard);

const listEl2 = document.getElementById('dayList');
days.forEach(day => {
  const btn = document.createElement('button');
  btn.className = 'day-btn';
  btn.id = 'day-' + day.n;
  btn.innerHTML = `<span class="swatch" style="background:${day.color}"></span>Day ${day.n} — ${day.title}`;
  btn.onclick = () => showOnly(day.n);
  listEl2.appendChild(btn);
});
document.getElementById('allBtn').onclick = () => showOnly('all');

showOnly('all');
</script>
